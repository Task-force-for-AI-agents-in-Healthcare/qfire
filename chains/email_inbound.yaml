# Inbound service mail that an AI agent will read (e.g. an agent's signup
# inbox). Expression mode: the message must pass the reused injection guards AND
# the three positive-security email rules (rules/email/email_inbound.yaml).
#
# Offline and deterministic: no judge node and no embedding node, so the verdict
# is the same with or without a model provider. For the opt-in LLM judge see
# chains/email_inbound_judge.yaml (shadow mode).
#
# Input shape: "Subject: <subject>\n\n<visible text>".
#
# Regex rules can be beaten by paraphrase. This chain stops the common, cheap
# forms of injection aimed at an AI mail reader; a reworded attack that avoids
# their wording gets through. corpora/email/attack_heldout (not tuned on)
# measures that gap; the opt-in judge chains are the paraphrase backstop.
#
# Shared guards left out, each with its reason (false positives measured on
# synthetic benign service mail, visible text). The shared rules themselves are
# untouched (the paper and E7 numbers depend on them); where coverage is still
# wanted, an email variant takes the shared rule's place, following the E7
# precedent.
#   - injection_encoding_obfuscation: 96/114 blocked by its entropy node
#     (whole-text entropy ~4.72 bits/char vs a 4.70 limit).
#   - e7_injection_encoding_obfuscation (its E7 variant, entropy dropped): also
#     left out. Under `normalize_mode: triggered`, any message with an encoding
#     signal (an accented name, a Japanese footer, a long base64url magic-link
#     token) is expanded, and the expansion always carries a `[deobf:rot13]`
#     layer label, which that rule's `(?i)rot13` pattern matches. The decoded
#     layers are still scanned by every other rule (the IMP anchors accept the
#     `[deobf:...]` layer prefix), its `base64:` pattern is copied into
#     email_task_hijack, and "decode ... and do what it says" is caught there.
#   - injection_instruction_override: replaced by email_instruction_override.
#     The shared rule matches correction mail ("Please ignore the previous
#     message, it was sent in error") and its DeBERTa node, with no ONNX model,
#     falls back to a lexical score that is noise on mail.
#   - injection_classifier_only: dropped. It is only a DeBERTa node; with no
#     ONNX model its lexical fallback is noise on product copy.
#   Known false positive kept: "You are now in developer mode for your sandbox
#   account" still BLOCKs. email_jailbreak_dan and the email rules pass it, but
#   the DeBERTa lexical fallback inside the four kept shared guards
#   (injection_system_prompt_exfil, injection_delimiter_escape,
#   injection_tool_command_abuse, injection_multi_step_smuggle) scores
#   "you are now" + "developer mode" at 0.86 and blocks it. Accepted; see the
#   README's known false positives.
#   - injection_jailbreak_dan: `STAN` has no word boundary and matches
#     "Standard" (4/114 blocked).
#   - e7_injection_jailbreak_dan: replaced by email_jailbreak_dan. Its
#     `developer mode (enabled|on)` and bare `jailbreak` patterns, unbounded
#     `.*` and DeBERTa node fire on account notices ("Developer mode is now
#     enabled for your account").
#   - injection_role_manipulation: left out; `you are now (a|an|the)` matches
#     account notices like "You are now an admin of the Acme workspace". Its
#     attack forms are covered by email_task_hijack.
#   - injection_restriction_bypass: left out; plan copy such as "no
#     limitations" or "no restrictions on seats" reads as a restriction bypass.
#   - scope_agent_on_task: its regex blocked 44/114 (`to <email>`, "send ... to",
#     "also ... pay", "you are now a ..."). Its zero-false-positive subset lives
#     in the email rules instead.
#   - email_download_and_run (curl | sh, wget | bash, bash <(curl ...),
#     curl -o ... && bash): judge chains only. Developer-service welcome mail
#     contains install one-liners, so this chain must not block them.
id: email_inbound
description: "Inbound service mail read by an AI agent: injection guards + positive-security email rules. Offline, no LLM."
mode: expression
fail_policy: fail_closed
normalize_mode: triggered
groups:
  injection: >
    email_instruction_override AND injection_system_prompt_exfil AND
    injection_delimiter_escape AND injection_tool_command_abuse AND
    injection_multi_step_smuggle AND email_jailbreak_dan
  email_scope: >
    email_reader_addressed AND email_task_hijack AND email_out_of_scope_action
expression: "injection AND email_scope"
